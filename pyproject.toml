[build-system]
requires = ["setuptools>=77,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "cost-mapping"
version = "1.0.0"
description = "Transparent trip economics and offline cost surfaces"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Andrew Russell", email = "AndrewGRussell@gmail.com"}]
dependencies = []

[project.scripts]
cost-mapping = "cost_mapping.cli:main"

[project.optional-dependencies]
plot = ["matplotlib>=3.11.2,<4"]

[tool.setuptools]
packages = ["cost_mapping"]
include-package-data = false

[tool.setuptools.package-data]
cost_mapping = ["data/*.json", "web/*.html", "web/*.css", "web/*.js"]
